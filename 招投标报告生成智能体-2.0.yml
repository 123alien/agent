            temperature: 0.1
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: report-system-prompt
          role: system
          text: |
            你是招投标报告生成智能体的报告内容规划模块。

            你只负责根据输入数据规划报告标题、摘要和章节，不负责生成Word或PDF文件。

            规则：
            1. 不得新增输入中不存在的问题、主体、金额、日期、法规、证据或结论。
            2. 人工复核结论优先于自动分析；被确认误判的项目不得进入问题清单。
            3. 不得改写原始 evidence；不得把待确认事项表述为确定事实。
            4. 字段冲突或缺失不得自行选择值，必须放入 conflicts 或 missing_fields。
            5. 标准化评标报告中的事实必须已有可靠数据或人工确认支持。
            6. 输出内容应适合后端生成正式Word和PDF。
            7. 只输出合法JSON，不得输出Markdown、代码围栏或解释文字。

            输出格式：
            {
              "report_title": "string",
              "executive_summary": "string",
              "sections": [
                {
                  "section_id": "string",
                  "title": "string",
                  "content": "string",
                  "source_types": ["parsed_documents|compliance|validation|anomaly|human_review"]
                }
              ],
              "missing_fields": ["string"],
              "conflicts": ["string"],
              "rectification_suggestions": ["string"]
            }
        - id: report-user-prompt
          role: user
          text: |
            【输出任务】
            {{#report-normalize.output_instruction#}}

            【模板要求】
            {{#report-normalize.template_instruction#}}

            【标准化输入数据】
            {{#report-normalize.normalized_input#}}

            请生成报告内容规划JSON。
        selected: false
        title: 报告内容规划
        type: llm
        vision:
          enabled: false
      height: 88
      id: report-plan
      position:
        x: 700
        y: 280
      positionAbsolute:
        x: 700
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          import json
          import re

          def parse_json(value, default):
              if value is None or value == "":
                  return default
              if isinstance(value, (dict, list)):
                  return value
              text = str(value).strip()
              text = re.sub(r"^```(?:json)?\s*", "", text, flags=re.I)
              text = re.sub(r"\s*```$", "", text)
              try:
                  return json.loads(text)
              except (json.JSONDecodeError, TypeError, ValueError):
                  return default

          def list_value(value):
              return value if isinstance(value, list) else []

          def source_items(data, key, source):
              if not isinstance(data, dict):
                  return []
              result = []
              for index, item in enumerate(list_value(data.get(key))):
                  if not isinstance(item, dict):
                      continue
                  if item.get("is_issue") is False or item.get("is_anomaly") is False:
                      continue
                  copied = dict(item)
                  copied["source_type"] = source
                  copied["issue_id"] = str(copied.get("issue_id") or copied.get("anomaly_id") or f"{source}-{index + 1}")
                  evidence = copied.get("evidence", [])
                  if isinstance(evidence, str):
                      evidence = [evidence]
                  copied["evidence"] = [str(x) for x in evidence if str(x).strip()]
                  copied["risk_level"] = str(copied.get("risk_level", "中"))
                  copied["issue_type"] = str(copied.get("issue_type") or copied.get("anomaly_type") or "待分类问题")
                  copied["description"] = str(copied.get("description", ""))
                  copied["basis"] = str(copied.get("basis", ""))
                  copied["suggestion"] = str(copied.get("suggestion", ""))
                  copied["requires_human_review"] = bool(copied.get("requires_human_review", False))
                  copied.pop("is_issue", None)
                  copied.pop("is_anomaly", None)
                  copied.pop("anomaly_id", None)
                  result.append(copied)
              return result

          def review_map(review):
              if not isinstance(review, dict):
                  return {}
              decisions = review.get("decisions") or review.get("items") or review.get("issues") or review.get("reviews") or []
              result = {}
              for item in list_value(decisions):
                  if not isinstance(item, dict):
                      continue
                  issue_id = str(item.get("issue_id") or item.get("anomaly_id") or "")
                  if issue_id:
                      result[issue_id] = item
              return result

          def main(normalized_input, model_text):
              normalized = parse_json(normalized_input, {})
              plan = parse_json(model_text, {})
              compliance = normalized.get("compliance_results", {})
              validation = normalized.get("validation_results", {})
              anomaly = normalized.get("anomaly_results", {})
              review = normalized.get("human_review_data", {})

              issues = []
              issues.extend(source_items(compliance, "issues", "compliance"))
              issues.extend(source_items(validation, "issues", "validation"))
              issues.extend(source_items(anomaly, "anomalies", "anomaly"))

              decisions = review_map(review)
              retained = []
              for item in issues:
                  decision = decisions.get(item["issue_id"], {})
                  status = str(decision.get("decision") or decision.get("status") or "").lower()
                  false_positive = decision.get("false_positive") is True or status in {
                      "false_positive", "误判", "不成立", "排除"
                  }
                  if false_positive:
                      continue
                  if decision:
                      item["review_decision"] = str(decision.get("decision") or decision.get("status") or "已复核")
                      if decision.get("corrected_description"):
                          item["description"] = str(decision["corrected_description"])
                      if decision.get("corrected_suggestion"):
                          item["suggestion"] = str(decision["corrected_suggestion"])
                      item["requires_human_review"] = False
                  else:
                      item["review_decision"] = "待复核" if item["requires_human_review"] else "自动核验"
                  retained.append(item)

              counts = {"high": 0, "medium": 0, "low": 0, "total": len(retained)}
              for item in retained:
                  level = item.get("risk_level", "中")
                  if level in ("高", "high", "HIGH"):
                      counts["high"] += 1
                  elif level in ("低", "low", "LOW"):
                      counts["low"] += 1
                  else:
                      counts["medium"] += 1

              pending = [x for x in retained if x.get("requires_human_review")]
              output_type = str(normalized.get("output_type", "综合智能核验报告"))
              committee_confirmed = isinstance(review, dict) and review.get("committee_confirmed") is True
              if output_type == "标准化评标报告":
                  report_status = "正式版" if committee_confirmed and not pending else "标准化评标报告待确认版"
              else:
                  report_status = "待复核版" if pending else "正式核验版"

              sections = []
              for section in list_value(plan.get("sections")):
                  if not isinstance(section, dict):
                      continue
                  sections.append({
                      "section_id": str(section.get("section_id", "")),
                      "title": str(section.get("title", "")),
                      "content": str(section.get("content", "")),
                      "source_types": [str(x) for x in list_value(section.get("source_types"))],
                  })

              project = normalized.get("project_info", {})
              project_name = str(project.get("project_name") or project.get("name") or "未命名项目") if isinstance(project, dict) else "未命名项目"
              title = f"{project_name}{output_type}"
              summary = (
                  f"本次核验共发现{len(retained)}项明确或潜在问题，"
                  f"其中高风险{counts['high']}项、中风险{counts['medium']}项、"
                  f"低风险{counts['low']}项，尚有{len(pending)}项需要人工复核。"
              )

              parsed = normalized.get("parsed_documents", {})
              explicit_missing = []
              if isinstance(parsed, dict):
                  explicit_missing = [str(x) for x in list_value(parsed.get("missing_fields"))]

              explicit_conflicts = []
              for item in retained:
                  if item.get("source_type") != "validation":
                      continue
                  field_name = str(item.get("field_name", "")).strip()
                  value_1 = str(item.get("value_1", "")).strip()
                  value_2 = str(item.get("value_2", "")).strip()
                  if field_name and value_1 and value_2:
                      explicit_conflicts.append(f"{field_name}：{value_1} / {value_2}")

              suggestions = []
              for item in retained:
                  suggestion = str(item.get("suggestion", "")).strip()
                  if suggestion and suggestion not in suggestions:
                      suggestions.append(suggestion)
              result = {
                  "report_title": title,
                  "report_type": output_type,
                  "report_status": report_status,
                  "template_type": str(normalized.get("template_type", "标准审查报告")),
                  "project_info": project,
                  "executive_summary": summary,
                  "risk_statistics": counts,
                  "sections": sections,
                  "issues": retained,
                  "pending_review_items": [x["issue_id"] for x in pending],
                  "missing_fields": explicit_missing,
                  "conflicts": explicit_conflicts,
                  "rectification_suggestions": suggestions,
                  "human_review": review,
                  "committee_confirmation_required": output_type == "标准化评标报告" and not committee_confirmed,
              }
              return {"result": result}
        code_language: python3
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: 报告结果校验
        type: code
        variables:
        - value_selector: [report-normalize, normalized_input]
          value_type: string
          variable: normalized_input
        - value_selector: [report-plan, text]
          value_type: string
          variable: model_text
      height: 54
      id: report-validate
      position:
        x: 1010
        y: 280
      positionAbsolute:
        x: 1010
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        outputs:
        - value_selector: [report-validate, result]
          variable: result
        selected: false
        title: 输出
        type: end
      height: 90
      id: report-end
      position:
        x: 1320
        y: 280
      positionAbsolute:
        x: 1320
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
