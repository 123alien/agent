    - data:
        code: |
          import json

          def parse_json(value, default):
              if value is None or value == "":
                  return default
              if isinstance(value, (dict, list)):
                  return value
              try:
                  return json.loads(value)
              except (json.JSONDecodeError, TypeError, ValueError):
                  return default

          def main(output_type, project_info, parsed_documents,
                   compliance_results, validation_results, anomaly_results,
                   human_review_data, template_type):
              project = parse_json(project_info, {})
              parsed = parse_json(parsed_documents, {})
              compliance = parse_json(compliance_results, {"summary": "", "issues": []})
              validation = parse_json(validation_results, {"summary": "", "issues": []})
              anomaly = parse_json(anomaly_results, {"summary": "", "anomalies": []})
              human_review = parse_json(human_review_data, {})

              output_instructions = {
                  "综合智能核验报告": "综合汇总全部智能体结论，形成完整的《评标智能核验报告》。",
                  "合规审查专项报告": "重点呈现合规问题、原文证据、依据、建议和待复核事项。",
                  "数据核验专项报告": "重点呈现字段冲突、计算错误、评分复算和排序核验结果。",
                  "异常分析专项报告": "重点呈现跨文件、跨主体、多信号组合及专家打分异常线索。",
                  "整改建议报告": "按风险等级和整改优先级组织问题及可执行整改建议。",
                  "标准化评标报告": "根据已经确认的可靠数据规划标准化《评标报告》；未确认内容必须标记待确认。",
              }
              template_instructions = {
                  "标准审查报告": "采用完整、正式的核验报告结构。",
                  "简版管理层报告": "突出结论、风险数量、重大问题和管理建议。",
                  "详细审查报告": "逐项呈现问题、证据、依据、建议和复核状态。",
                  "整改建议报告": "按照问题、整改措施、优先级和复核要求组织。",
                  "标准化评标报告": "采用标准评标报告章节，但不得写入未经确认的事实。",
              }
              normalized = {
                  "output_type": output_type,
                  "template_type": template_type,
                  "project_info": project,
                  "parsed_documents": parsed,
                  "compliance_results": compliance,
                  "validation_results": validation,
                  "anomaly_results": anomaly,
                  "human_review_data": human_review,
              }
              return {
                  "normalized_input": json.dumps(normalized, ensure_ascii=False),
                  "output_instruction": output_instructions.get(output_type, output_instructions["综合智能核验报告"]),
                  "template_instruction": template_instructions.get(template_type, template_instructions["标准审查报告"]),
              }
        code_language: python3
        outputs:
          normalized_input:
            children: null
            type: string
          output_instruction:
            children: null
            type: string
          template_instruction:
            children: null
            type: string
        selected: false
        title: 输入标准化
